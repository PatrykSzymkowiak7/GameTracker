services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/GameTracker.db"
      Jwt__Key: "${JWT_KEY}"
      
    volumes:
      - gametracker-data:/app/data
      
    healthcheck:
        test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready || exit 1"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 20s

volumes:
  gametracker-data: