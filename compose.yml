services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/GameTracker.db"
      Jwt__Key: "${JWT_KEY}"
    volumes:
      - gametracker-data:/app/data

volumes:
  gametracker-data: