name: GameTracker CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore GameTracker.sln

      - name: Build solution
        run: dotnet build GameTracker.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GameTracker.sln --configuration Release --no-build --verbosity normal
        env:
          Jwt__Key: "GameTracker_Test_Only_Jwt_Key_2026_AtLeast32Chars!"
          Jwt__Issuer: "GameTracker"
          Jwt__Audience: "GameTracker.Api"
          Jwt__ExpirationMinutes: "60"

      - name: Build Docker image
        run: docker build -t gametracker-api:ci .